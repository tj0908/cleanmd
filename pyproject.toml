[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanmd"
version = "0.1.0"
description = "把文档转成干净的 Markdown：格式转换 + 清洗，专为 RAG 预处理设计"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "markdown", "document", "preprocessing", "llm"]
dependencies = [
    "markitdown[docx,pdf,xlsx]",
]

[project.scripts]
cleanmd = "cleanmd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cleanmd*"]
